# ============================================================
# Imagine V2 — App (Portainer Stack / Docker Swarm + Traefik)
# ------------------------------------------------------------
# Stack principal: migrator + web.
#
# Infra em stacks separadas (deployar ANTES desta):
#   - docker-compose.portainer.postgres.yml → imagine-db
#   - docker-compose.portainer.minio.yml      → minio + minio-init
#
# Rede overlay: traefik_public (hostnames imagine-db, minio entre stacks).
#
# Pré-requisitos no servidor:
#   1) Traefik na rede traefik_public
#   2) DNS APP_HOST → servidor
#   3) Registry taticweb no Portainer
#   4) Imagens publicadas:
#        taticweb/imagine-web-builder:latest
#        taticweb/imagine-web:latest
#
# Storage:
#   - S3/MinIO: variáveis abaixo (integração no código ainda pendente)
#   - Volume imagine_media: fallback local até S3 estar ativo no app
#
# Banco:
#   - Stack postgres define imagine-db (DB imagine, user postgres)
#   - ATENÇÃO: o app V2 ainda usa SQLite no código; DATABASE_URL abaixo
#     é o alvo para quando migrar para Postgres. Hoje use o volume imagine_data.
# ============================================================

version: "3.8"

x-common-env: &common-env
  NODE_ENV: production
  NEXT_PUBLIC_APP_URL: https://${APP_HOST:-app.example.com}
  DATABASE_URL: ${DATABASE_URL:-/app/data/app.db}
  POSTGRES_HOST: imagine-db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  POSTGRES_DB: ${POSTGRES_DB:-imagine}

  # Clerk
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
  NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /
  NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /

  # OpenRouter
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_LLM_MODEL: ${OPENROUTER_LLM_MODEL:-anthropic/claude-opus-4.7}
  OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-bytedance-seed/seedream-4.5}
  OPENROUTER_VIDEO_MODEL: ${OPENROUTER_VIDEO_MODEL:-kwaivgi/kling-v3.0-pro}
  OPENROUTER_TTS_MODEL: ${OPENROUTER_TTS_MODEL:-google/gemini-3.1-flash-tts-preview}
  OPENROUTER_MUSIC_MODEL: ${OPENROUTER_MUSIC_MODEL:-google/lyria-3-pro-preview}

  # S3 / MinIO (servidor de arquivos)
  S3_ENDPOINT: http://minio:9000
  S3_REGION: auto
  S3_BUCKET: ${S3_BUCKET:-imagine}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"
  # URL pública opcional (CDN ou domínio do MinIO via Traefik)
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

services:
  migrator:
    image: taticweb/imagine-web-builder:latest
    environment: *common-env
    volumes:
      - imagine_data:/app/data
    networks:
      - traefik_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s

  web:
    image: taticweb/imagine-web:latest
    environment:
      <<: *common-env
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      - imagine_data:/app/data
    networks:
      - traefik_public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_public
        - traefik.http.routers.imagine-web.rule=Host(`${APP_HOST:-app.example.com}`)
        - traefik.http.routers.imagine-web.entrypoints=websecure
        - traefik.http.routers.imagine-web.tls.certresolver=le
        - traefik.http.routers.imagine-web.service=imagine-web
        - traefik.http.services.imagine-web.loadbalancer.server.port=3000
        - traefik.http.routers.imagine-web-http.rule=Host(`${APP_HOST:-app.example.com}`)
        - traefik.http.routers.imagine-web-http.entrypoints=web
        - traefik.http.routers.imagine-web-http.middlewares=imagine-https-redirect
        - traefik.http.middlewares.imagine-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.imagine-https-redirect.redirectscheme.permanent=true

volumes:
  imagine_data:

networks:
  traefik_public:
    external: true
    name: traefik_public
