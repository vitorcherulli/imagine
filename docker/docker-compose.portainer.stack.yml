# ============================================================
# Imagine V2 — Stack única para Portainer (copiar e colar)
# ------------------------------------------------------------
# Defina as variáveis sensíveis no Portainer (Environment)
# ou use docker/.env.portainer (local, gitignored).
# Ver: docker/.env.portainer.example
#
# Ao subir, o serviço migrator:
#   1) espera o Postgres (postgres:5432)
#   2) cria/atualiza tabelas via Drizzle
#   3) encerra — o web sobe em seguida
#
# Infra já existente no servidor:
#   - PostgreSQL (hostname: postgres, DB: imagine)
#   - S3 (configure S3_ENDPOINT / S3_PUBLIC_URL)
#   - Traefik na rede traefik_public
# ============================================================

version: "3.8"

x-common-env: &common-env
  NODE_ENV: production
  APP_HOST: ${APP_HOST:-app.example.com}
  NEXT_PUBLIC_APP_URL: https://${APP_HOST:-app.example.com}

  # PostgreSQL (já instalado no servidor)
  DATABASE_URL: ${DATABASE_URL}

  # Clerk
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /

  # OpenRouter (modelos de produção)
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_LLM_MODEL: ${OPENROUTER_LLM_MODEL:-anthropic/claude-opus-4.7}
  OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-bytedance-seed/seedream-4.5}
  OPENROUTER_VIDEO_MODEL: ${OPENROUTER_VIDEO_MODEL:-kwaivgi/kling-v3.0-pro}
  OPENROUTER_TTS_MODEL: ${OPENROUTER_TTS_MODEL:-google/gemini-3.1-flash-tts-preview}
  OPENROUTER_MUSIC_MODEL: ${OPENROUTER_MUSIC_MODEL:-google/lyria-3-pro-preview}

  # S3
  S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.example.com}
  S3_REGION: auto
  S3_BUCKET: ${S3_BUCKET:-imagine}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://s3.example.com}

  # Stock media (opcional)
  PEXELS_API_KEY: ${PEXELS_API_KEY:-}
  GOOGLE_CUSTOM_SEARCH_API_KEY: ${GOOGLE_CUSTOM_SEARCH_API_KEY:-}
  GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
  SERPER_API_KEY: ${SERPER_API_KEY:-}

  # ElevenLabs (opcional)
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

services:
  migrator:
    image: taticweb/imagine-web-builder:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Aguardando postgres..."
        until nc -z postgres 5432; do sleep 2; done
        echo "Postgres pronto. Rodando migrations..."
        npx tsx src/lib/db/migrate.ts
    environment: *common-env
    networks:
      - traefik_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s

  web:
    image: taticweb/imagine-web:latest
    environment:
      <<: *common-env
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - traefik_public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_public
        - traefik.http.routers.imagine-web.rule=Host(`${APP_HOST:-app.example.com}`)
        - traefik.http.routers.imagine-web.entrypoints=websecure
        - traefik.http.routers.imagine-web.tls.certresolver=le
        - traefik.http.routers.imagine-web.service=imagine-web
        - traefik.http.services.imagine-web.loadbalancer.server.port=3000
        - traefik.http.routers.imagine-web-http.rule=Host(`${APP_HOST:-app.example.com}`)
        - traefik.http.routers.imagine-web-http.entrypoints=web
        - traefik.http.routers.imagine-web-http.middlewares=imagine-https-redirect
        - traefik.http.middlewares.imagine-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.imagine-https-redirect.redirectscheme.permanent=true

networks:
  traefik_public:
    external: true
    name: traefik_public
