# ============================================================
# Imagine V2 — Stack única para Portainer (copiar e colar)
# Chaves preenchidas — NÃO commitar em repo público.
# ------------------------------------------------------------
# Infra já existente no servidor:
#   - PostgreSQL (hostname: postgres, DB: imagine)
#   - S3 em https://s3.papo.global
#   - Traefik na rede traefik_public
# ============================================================

version: "3.8"

x-common-env: &common-env
  NODE_ENV: production
  APP_HOST: imagine.papo.global
  NEXT_PUBLIC_APP_URL: https://imagine.papo.global

  # PostgreSQL (já instalado no servidor)
  DATABASE_URL: postgres://postgres:changeme@postgres:5432/imagine

  # Clerk
  CLERK_SECRET_KEY: sk-or-v1-REDACTED_OPENROUTER_KEY_ALT
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_REDACTED_CLERK_PUBLISHABLE
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /

  # OpenRouter (modelos de produção)
  OPENROUTER_API_KEY: sk-or-v1-REDACTED_OPENROUTER_KEY
  OPENROUTER_LLM_MODEL: anthropic/claude-opus-4.7
  OPENROUTER_IMAGE_MODEL: bytedance-seed/seedream-4.5
  OPENROUTER_VIDEO_MODEL: kwaivgi/kling-v3.0-pro
  OPENROUTER_TTS_MODEL: google/gemini-3.1-flash-tts-preview
  OPENROUTER_MUSIC_MODEL: google/lyria-3-pro-preview

  # S3 — https://s3.papo.global
  S3_ENDPOINT: https://s3.papo.global
  S3_REGION: auto
  S3_BUCKET: imagine
  S3_ACCESS_KEY: REDACTED_S3_ACCESS
  S3_SECRET_KEY: REDACTED_S3_SECRET
  S3_ACCESS_KEY_ID: REDACTED_S3_ACCESS
  S3_SECRET_ACCESS_KEY: REDACTED_S3_SECRET
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_URL: https://s3.papo.global

  # Stock media (opcional — busca de imagens/vídeos)
  PEXELS_API_KEY: ""
  GOOGLE_CUSTOM_SEARCH_API_KEY: ""
  GOOGLE_CSE_ID: YOUR_GOOGLE_CSE_ID
  SERPER_API_KEY: ""

  # ElevenLabs (opcional — vozes premium)
  ELEVENLABS_API_KEY: ""

services:
  migrator:
    image: taticweb/imagine-web-builder:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Aguardando postgres..."
        until nc -z postgres 5432; do sleep 2; done
        echo "Postgres pronto. Rodando migrations..."
        npx tsx src/lib/db/migrate.ts
    environment: *common-env
    networks:
      - traefik_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s

  web:
    image: taticweb/imagine-web:latest
    environment:
      <<: *common-env
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - traefik_public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_public
        - traefik.http.routers.imagine-web.rule=Host(`imagine.papo.global`)
        - traefik.http.routers.imagine-web.entrypoints=websecure
        - traefik.http.routers.imagine-web.tls.certresolver=le
        - traefik.http.routers.imagine-web.service=imagine-web
        - traefik.http.services.imagine-web.loadbalancer.server.port=3000
        - traefik.http.routers.imagine-web-http.rule=Host(`imagine.papo.global`)
        - traefik.http.routers.imagine-web-http.entrypoints=web
        - traefik.http.routers.imagine-web-http.middlewares=imagine-https-redirect
        - traefik.http.middlewares.imagine-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.imagine-https-redirect.redirectscheme.permanent=true

networks:
  traefik_public:
    external: true
    name: traefik_public
